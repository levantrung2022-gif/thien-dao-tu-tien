<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10152b">
<title>Thiên Đạo - Tu Tiên</title>
<style>
:root{--bg:#0c1124;--panel:#171f3b;--panel2:#202b4d;--gold:#f4d58a;--cyan:#7ce7e1;--muted:#aab5d2;--red:#ff827e;--green:#8be0a2}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080d1c;color:#f4f1e8;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{display:flex;justify-content:center;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#game{width:min(100vw,480px);height:100dvh;min-height:560px;max-height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#29385e 0,#111a34 42%,#0b1021 100%);border-inline:1px solid #354363}
header{padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;justify-content:space-between;background:#0c1328d9;border-bottom:1px solid #394766;z-index:2}
.logo{font-weight:900;letter-spacing:1.5px;color:var(--gold);font-size:17px}.realm{font-size:11px;color:var(--muted);text-align:right}
.resources{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px 10px;background:#111a30}
.res{background:#202b49;border:1px solid #3a496d;border-radius:10px;padding:6px 8px;font-size:11px;color:var(--muted)}.res b{display:block;color:#fff;font-size:14px;margin-top:2px}
main{flex:1;overflow:auto;padding:12px 12px 86px;scrollbar-width:none}main::-webkit-scrollbar{display:none}
.hero{border:1px solid #65769a;border-radius:17px;padding:14px;background:linear-gradient(145deg,#344568,#172542 58%,#30274b);position:relative;overflow:hidden;min-height:190px}
.hero:after{content:"☯";position:absolute;right:12px;top:10px;font-size:100px;color:#f4d58a18}
.heroTop{display:flex;justify-content:space-between;position:relative;z-index:1}.tag{font-size:10px;color:#dce7ff;background:#ffffff18;border:1px solid #ffffff24;padding:4px 8px;border-radius:20px}
.avatar{font-size:54px;text-align:center;margin:3px 0 0;filter:drop-shadow(0 6px 8px #0008)}
.heroname{text-align:center;font-weight:800;color:var(--gold);font-size:17px}.subtitle{text-align:center;color:#c1cce2;font-size:11px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px;position:relative;z-index:1}.stat{background:#09132680;border-radius:9px;padding:7px;text-align:center;font-size:10px;color:#b8c5df}.stat b{display:block;font-size:13px;color:white}
.card{background:linear-gradient(145deg,#1b2745,#131d36);border:1px solid #354568;border-radius:14px;padding:12px;margin-top:11px;box-shadow:0 8px 20px #0002}
.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.cardhead strong{color:var(--gold);font-size:14px}.small{font-size:11px;color:var(--muted)}
.progress{height:9px;background:#080f20;border:1px solid #34415f;border-radius:20px;overflow:hidden;margin:8px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#4fc6c0,#e6d08d);border-radius:20px;transition:width .25s}
.btn{background:linear-gradient(135deg,#b68a49,#efd79a);color:#241b10;font-weight:800;border-radius:10px;padding:10px 12px;font-size:12px;box-shadow:inset 0 1px #fff8}.btn.secondary{background:#2c3b60;color:#e8edff;border:1px solid #52658d;box-shadow:none}.btn.danger{background:#693b50;color:#ffe4e4;box-shadow:none}.btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wide{width:100%}
.nav{position:absolute;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(7,1fr);padding:8px 3px calc(env(safe-area-inset-bottom) + 7px);background:#0b1226f5;border-top:1px solid #3a496b;z-index:5}
.nav button{background:transparent;color:#9eabc9;font-size:9px;padding:4px 0}.nav button span{display:block;font-size:20px;margin-bottom:2px}.nav button.active{color:var(--gold)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #ffffff12}.item:last-child{border:0}.itemname{font-size:12px;font-weight:700}.itemdesc{font-size:10px;color:var(--muted);margin-top:3px}
.pill{font-size:10px;padding:4px 7px;border-radius:20px;background:#31415f;color:#cfe7ff;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:9px}.tabs button{white-space:nowrap;padding:7px 10px;border-radius:20px;background:#263454;color:#b9c5df;font-size:11px}.tabs button.sel{background:#e4c783;color:#211a0e;font-weight:800}
.enemy{display:flex;align-items:center;justify-content:space-around;text-align:center;padding:14px;background:radial-gradient(ellipse,#563d5c,#1b203e 70%);border-radius:13px;border:1px solid #745b76}.enemy .emoji{font-size:52px}.hp{height:8px;background:#311c2c;border-radius:10px;overflow:hidden;margin-top:5px}.hp i{display:block;height:100%;background:linear-gradient(90deg,#e65e70,#ffad80);width:100%}
.battlelog{height:85px;overflow:auto;background:#090f20;border-radius:9px;padding:8px;font-size:10px;color:#b9c8e4;line-height:1.55;margin:9px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{background:#202d4e;border:1px solid #405477;border-radius:11px;padding:10px;text-align:center}.tile .ico{font-size:24px}.tile b{display:block;font-size:12px;margin:4px 0}.tile small{font-size:10px;color:var(--muted)}
.notice{font-size:10px;color:#aebbd6;line-height:1.5;margin-top:8px}.savebar{display:flex;gap:7px;margin-top:9px}.savebar .btn{flex:1}.skillbox{background:#172a43;border:1px solid #4d7890;border-radius:10px;padding:9px;margin-top:8px}.featureGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.feature{background:linear-gradient(145deg,#253656,#18233e);border:1px solid #526487;border-radius:12px;padding:10px}.feature b{display:block;color:var(--gold);font-size:12px;margin:4px 0}.feature small{font-size:10px;color:var(--muted)}.goldtext{color:var(--gold)}
.walletHero{background:linear-gradient(135deg,#3b315d,#172847);border:1px solid #75639b;border-radius:14px;padding:14px;text-align:center}.xuBalance{font-size:32px;font-weight:900;color:var(--gold);margin:5px}.field{width:100%;padding:11px;border-radius:9px;border:1px solid #506184;background:#0c162c;color:white;margin:5px 0 10px;font:inherit}.qr{width:100%;max-width:300px;display:block;margin:10px auto;border-radius:12px;background:white}.modal{position:absolute;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:22px;z-index:10}.modal.show{display:flex}.dialog{width:100%;max-height:80%;overflow:auto;background:#182440;border:1px solid #6b789a;border-radius:16px;padding:16px}.dialog h3{color:var(--gold);margin:0 0 8px}.toast{position:absolute;top:78px;left:50%;transform:translateX(-50%);background:#f1d89b;color:#211a0e;padding:8px 14px;border-radius:20px;font-size:11px;font-weight:800;z-index:20;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(min-width:481px){#game{height: min(100dvh,900px);margin:auto;border-radius:20px;border:1px solid #435477}}
</style>

function getAccounts(){try{return JSON.parse(localStorage.getItem(accountStoreKey)||"{}")}catch(e){return {}}}
async function hashPassword(p){const bytes=new TextEncoder().encode(p);const digest=await crypto.subtle.digest("SHA-256",bytes);return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function accountMenu(){
 if(currentUser){$("dialog").innerHTML=`<h3>👤 Tài khoản</h3><p class="small">Đang đăng nhập: <b>${escapeHTML(currentUser)}</b></p><p class="small">Xu Web: <b class="goldtext">${fmt(state.xu||0)}</b></p><button class="btn secondary wide" onclick="logout()">Đăng xuất</button><button class="btn secondary wide" style="margin-top:8px" onclick="closeModal()">Đóng</button>`}
 else{$("dialog").innerHTML=`<h3>🔐 Đăng nhập / Đăng ký</h3><label class="small">Tên tài khoản</label><input class="field" id="authUser" maxlength="20" autocomplete="username" placeholder="Nhập tên tài khoản"><label class="small">Mật khẩu</label><input class="field" id="authPass" type="password" autocomplete="current-password" placeholder="Ít nhất 6 ký tự"><div class="actions"><button class="btn" onclick="registerAccount()">Đăng ký</button><button class="btn secondary" onclick="loginAccount()">Đăng nhập</button></div><p class="notice">Bản thử nghiệm lưu tài khoản trên trình duyệt này, chưa đồng bộ giữa các thiết bị.</p><button class="btn secondary wide" onclick="closeModal()">Đóng</button>`}
 $("modal").classList.add("show");
}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function registerAccount(){const u=$("authUser").value.trim(),p=$("authPass").value;if(!/^[A-Za-z0-9_]{3,20}$/.test(u)||p.length<6){notify("Tên 3–20 ký tự, mật khẩu tối thiểu 6 ký tự");return}const a=getAccounts();if(a[u]){notify("Tên tài khoản đã tồn tại");return}a[u]={hash:await hashPassword(p),game:{...defaults,name:u}};localStorage.setItem(accountStoreKey,JSON.stringify(a));currentUser=u;localStorage.setItem("td_current_user",u);state={...defaults,name:u};saveGame();closeModal();notify("Đăng ký thành công");render()}
async function loginAccount(){const u=$("authUser").value.trim(),p=$("authPass").value,a=getAccounts();if(!a[u]||a[u].hash!==await hashPassword(p)){notify("Sai tên tài khoản hoặc mật khẩu");return}currentUser=u;localStorage.setItem("td_current_user",u);state={...defaults,...a[u].game,quests:{...defaults.quests,...(a[u].game.quests||{})},claimed:{...(a[u].game.claimed||{})}};localStorage.setItem("thienDaoSaveV2",JSON.stringify(state));closeModal();notify("Đăng nhập thành công");render()}
function logout(){if(currentUser){const a=getAccounts();if(a[currentUser])a[currentUser].game={...state};localStorage.setItem(accountStoreKey,JSON.stringify(a))}currentUser="";localStorage.removeItem("td_current_user");state={...defaults};closeModal();accountMenu()}
function requireLogin(){if(!currentUser){notify("Anh đăng nhập tài khoản trước nhé");accountMenu();return false}return true}
function requestDeposit(){if(!requireLogin())return;const amount=Number($("depositAmount").value);if(![10000,20000,50000,100000,200000,500000].includes(amount)){notify("Chọn mệnh giá nạp hợp lệ");return}const code="TD"+currentUser.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8)+Math.random().toString(36).slice(2,6).toUpperCase();const all=JSON.parse(localStorage.getItem("td_deposit_requests")||"[]");all.unshift({user:currentUser,amount,code,status:"Chờ xác nhận",created:new Date().toISOString()});localStorage.setItem("td_deposit_requests",JSON.stringify(all));$("depositResult").innerHTML=`<div class="skillbox"><b class="goldtext">Đã tạo yêu cầu nạp</b><p class="small">Nội dung chuyển khoản: <b>${code}</b></p><p class="small">Số tiền: ${fmt(amount)}đ · Trạng thái: Chờ xác nhận</p><p class="notice">Xu chỉ được cộng sau khi giao dịch được chủ game kiểm tra và xác nhận.</p></div>`;notify("Đã tạo yêu cầu nạp")}
function fmt(n){return Math.floor(n).toLocaleString("vi-VN")}
function saveGame(show=false){try{localStorage.setItem("thienDaoSaveV2",JSON.stringify(state));if(currentUser){let a=getAccounts();if(a[currentUser]){a[currentUser].game={...state};localStorage.setItem(accountStoreKey,JSON.stringify(a))}}if(show)notify("Đã lưu tiến trình trên thiết bị")}catch(e){if(show)notify("Không thể lưu trên trình duyệt này")}}
function loadGame(){try{let raw=localStorage.getItem("thienDaoSaveV2");if(raw){let d=JSON.parse(raw);state={...defaults,...d,quests:{...defaults.quests,...(d.quests||{})},claimed:{...(d.claimed||{})}}}}catch(e){}}
function renamePlayer(){let n=prompt("Nhập đạo hiệu mới (tối đa 16 ký tự):",state.name);if(n&&n.trim()){state.name=n.trim().slice(0,16);log("Đổi đạo hiệu thành "+state.name);render()}}
function claimQuest(key,reward){if(!state.quests[key]||state.claimed[key])return;if(key==="login"){state.med++;}else{state.stone+=reward;}state.claimed[key]=true;log("Nhận thưởng nhiệm vụ: "+key);notify("Đã nhận thưởng nhiệm vụ");render()}
function notify(t){let el=$("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1700)}
function log(t){state.logs.unshift(t);state.logs=state.logs.slice(0,20)}
function update(){ if($("accountBtn"))$("accountBtn").textContent=currentUser?currentUser:"Đăng nhập"; $("stone").textContent=fmt(state.stone);$("xp").textContent=fmt(state.xp)+" / "+fmt(realms[state.realm][1]);state.power=state.atk*2+state.def*3+state.sword*8+state.armor*6;$("power").textContent=fmt(state.power);$("realmHead").innerHTML=realms[state.realm][0]+" · Tầng "+state.stage+"<br>Đạo tâm đang vững";saveGame(false);}
function gainXP(n){state.xp+=n;while(state.xp>=realms[state.realm][1]&&state.realm<realms.length-1){state.xp-=realms[state.realm][1];state.realm++;state.stage=1;state.maxhp+=25;state.hp=state.maxhp;state.atk+=5;state.def+=2;if(state.realm>=1)state.skill=1;notify("Đột phá thành công: "+realms[state.realm][0]+"!");log("Đột phá cảnh giới "+realms[state.realm][0]);}}

${item("🛡️","Huyền Thiết Giáp","Tăng 6 phòng ngự mỗi cấp · Cấp "+state.armor,``, `<button class="btn" onclick="upgrade('armor')">Cường hóa · 40 ✧</button>`)}
</div><div class="card"><div class="cardhead"><strong>🛒 Tiệm linh vật</strong></div><div class="item"><div><div class="itemname">Tiểu Hồi Nguyên Đan</div><div class="itemdesc">Hồi 45 sinh lực · Giá 25 linh thạch</div></div><button class="btn" onclick="buyMed()">Mua</button></div></div>`}
if(page==="sect"){c.innerHTML=`<div class="hero"><div class="heroTop"><span class="tag">🏮 Tông môn</span><span class="tag">Cấp ${state.sectLv}</span></div><div class="avatar">🏯</div><div class="heroname">${state.sect}</div><div class="subtitle">Nơi đồng đạo cùng tu luyện</div></div><div class="card"><div class="cardhead"><strong>📜 Tông môn đại điện</strong></div><div class="small">Gia nhập tông môn để nhận phúc lợi tu hành. Mỗi lần cống hiến tiêu hao 20 linh thạch.</div><div class="actions" style="margin-top:10px"><button class="btn" onclick="joinSect()">Gia nhập / đổi môn</button><button class="btn secondary" onclick="donate()">Cống hiến</button></div></div><div class="card"><div class="cardhead"><strong>🎁 Phúc lợi tông môn</strong></div><div class="item"><div><b class="itemname">Tĩnh Tâm Quyết</b><div class="itemdesc">Nhận 25 tu vi khi cống hiến</div></div><span class="pill">Thụ động</span></div><div class="item"><div><b class="itemname">Kho linh thạch</b><div class="itemdesc">Phần thưởng cống hiến</div></div><span class="pill">Đang mở</span></div></div>`}
if(page==="quest"){let qs=[["cult","Vận công một lần","20 linh thạch",20],["win","Thắng một trận thí luyện","35 linh thạch",35],["upgrade","Cường hóa trang bị","25 linh thạch",25],["login","Nhận quà mỗi ngày","1 đan dược",0]];c.innerHTML=`<div class="card"><div class="cardhead"><strong>📜 Nhiệm vụ tu hành</strong><span class="pill">Thưởng có thể nhận</span></div>${qs.map(q=>`<div class="item"><div><div class="itemname">${q[1]}</div><div class="itemdesc">Thưởng: ${q[2]}</div></div>${state.quests[q[0]]?`<button class="btn ${state.claimed&&state.claimed[q[0]]?"secondary":""}" onclick="claimQuest('${q[0]}',${q[3]})" ${state.claimed&&state.claimed[q[0]]?"disabled":""}>${state.claimed&&state.claimed[q[0]]?"Đã nhận":"Nhận thưởng"}</button>`:`<span class="pill">Chưa xong</span>`}</div>`).join("")}</div><div class="card"><strong style="color:var(--gold)">📚 Nhật ký hành trình</strong><div class="battlelog" style="height:180px">${state.logs.map(x=>"• "+x).join("<br>")||"Chưa có ghi chép."}</div></div>`}
if(page==="world"){let zones=[["🌲","Rừng Thanh Khê","Linh thảo và yêu thú cấp thấp",0],["⛰️","Hàn Phong Cốc","Sương lạnh, linh khí dày đặc",1],["🏔️","Vạn Kiếm Sơn","Kiếm ý cổ xưa, hiểm nguy trùng trùng",2],["🌋","Hỏa Diệm Bí Cảnh","Địa hỏa và dị bảo",3]];let z=zones[state.zone];c.innerHTML=`<div class="hero"><div class="heroTop"><span class="tag">🗺️ Sơn hà tu tiên</span><span class="tag">Khu vực ${state.zone+1}/4</span></div><div class="avatar">${z[0]}</div><div class="heroname">${z[1]}</div><div class="subtitle">${z[2]}</div><div class="stats"><div class="stat">🧭 Khám phá<b>${state.wins} lần</b></div><div class="stat">🌿 Linh thảo<b>${state.essence}</b></div><div class="stat">🏆 Chiến thắng<b>${state.wins}</b></div></div></div><div class="card"><div class="cardhead"><strong>📍 Chọn địa điểm</strong><span class="small">Mở khóa theo cảnh giới</span></div>${zones.map((v,i)=>`<div class="item"><div><div class="itemname">${v[0]} ${v[1]}</div><div class="itemdesc">${v[2]}</div></div><button class="btn ${state.zone===i?"secondary":""}" onclick="selectZone(${i})" ${i>state.realm?"disabled":""}>${i>state.realm?"Cần "+realms[i][0]:state.zone===i?"Đang ở":"Đi đến"}</button></div>`).join("")}</div><div class="card"><div class="cardhead"><strong>🔎 Thám hiểm bí cảnh</strong><span class="pill">1 lượt/ngày</span></div><div class="small">Khám phá khu vực để tìm linh thạch, linh thảo hoặc chạm trán yêu thú. Khu vực càng cao, phần thưởng càng lớn.</div><button class="btn wide" style="margin-top:10px" onclick="explore()" ${state.exploreDate===new Date().toLocaleDateString("en-CA")?"disabled":""}>${state.exploreDate===new Date().toLocaleDateString("en-CA")?"Đã thám hiểm hôm nay":"Bắt đầu thám hiểm"}</button></div><div class="card"><div class="cardhead"><strong>⚗️ Luyện đan</strong><span class="pill">Có ${state.essence} linh thảo</span></div><div class="small">Dùng 2 linh thảo để luyện 1 Tiểu Hồi Nguyên Đan.</div><button class="btn secondary wide" style="margin-top:10px" onclick="brew()" ${state.essence<2?"disabled":""}>Luyện một viên đan dược</button></div>
<div class="card"><div class="cardhead"><strong>👑 Boss bí cảnh</strong><span class="pill">Thắng ${state.bossWins} lần</span></div>
<div class="enemy"><div><div class="emoji">🐲</div><b>Cổ Long守 Hộ</b><div class="small">Thủ lĩnh bí cảnh</div></div><div style="width:48%"><div class="small">Sinh lực ${state.bossHp||"Chưa khiêu chiến"}/${state.bossMax||"—"}</div><div class="hp"><i style="width:${state.bossMax?Math.max(0,state.bossHp/state.bossMax*100):0}%"></i></div></div></div>
<div class="small" style="margin:8px 0">Phần thưởng: linh thạch, tu vi và cơ hội nhận linh thảo. Boss mạnh hơn yêu thú thường.</div>
<div class="actions"><button class="btn" onclick="bossChallenge()">Khiêu chiến</button><button class="btn secondary" onclick="bossStrike()" ${state.bossHp<=0?"disabled":""}>Xuất chiêu</button></div></div>`}
if(page==="wallet"){
 const reqs=JSON.parse(localStorage.getItem("td_deposit_requests")||"[]").filter(x=>x.user===currentUser);
 c.innerHTML=`<div class="walletHero"><div class="small">💎 SỐ DƯ XU WEB</div><div class="xuBalance">${fmt(state.xu||0)} Xu</div><div class="small">Tài khoản: ${escapeHTML(currentUser||"Chưa đăng nhập")}</div></div>
 <div class="card"><div class="cardhead"><strong>💳 Nạp Xu trực tiếp</strong><span class="pill">Techcombank</span></div><p class="small">Chọn số tiền, quét QR bên dưới và ghi đúng nội dung chuyển khoản do game tạo.</p><img class="qr" src="${bankQR}" alt="Mã QR chuyển khoản Techcombank"><label class="small">Số tiền muốn nạp</label><select id="depositAmount" class="field"><option value="10000">10.000đ</option><option value="20000">20.000đ</option><option value="50000">50.000đ</option><option value="100000">100.000đ</option><option value="200000">200.000đ</option><option value="500000">500.000đ</option></select><button class="btn wide" onclick="requestDeposit()">Tạo yêu cầu nạp</button><div id="depositResult"></div><p class="notice">Không chuyển tiền nếu nội dung giao dịch chưa được tạo. Không gửi mã OTP hoặc mật khẩu ngân hàng cho bất kỳ ai.</p></div>
 <div class="card"><div class="cardhead"><strong>🎁 Ưu đãi nạp lần đầu</strong><span class="pill">x100</span></div><p class="small">Tài khoản đủ điều kiện sẽ được áp dụng ưu đãi x100 khi chủ game xác nhận giao dịch đầu tiên. Xu chỉ được cộng sau khi kiểm tra tiền thực nhận.</p></div>
 <div class="card"><div class="cardhead"><strong>📜 Lịch sử yêu cầu nạp</strong></div>${reqs.length?reqs.slice(0,10).map(r=>`<div class="item"><div><b class="itemname">${fmt(r.amount)}đ</b><div class="itemdesc">${r.code} · ${new Date(r.created).toLocaleString("vi-VN")}</div></div><span class="pill">${r.status}</span></div>`).join(""):`<p class="small">Chưa có yêu cầu nạp.</p>`}</div>`;
}
}
function item(ico,name,desc,count,action){return `<div class="item"><div style="display:flex;gap:9px;align-items:center"><span style="font-size:24px">${ico}</span><div><div class="itemname">${name}</div><div class="itemdesc">${desc}</div><div class="small">Số lượng: ${count}</div></div></div>${action||""}</div>`}
function cultivate(){let n=20+state.realm*5;gainXP(n);state.quests.cult=true;log("Vận công thu được "+n+" tu vi");notify("Tu vi +"+n);render()}
function breakthrough(){if(state.xp<realms[state.realm][1]){notify("Tu vi chưa đủ để đột phá");return}if(state.realm===realms.length-1){notify("Đã đạt cảnh giới tối cao!");return}gainXP(0);render()}
function daily(){let today=new Date().toLocaleDateString("en-CA");if(state.dailyDate===today){notify("Hôm nay đã nhận quà rồi");return}state.dailyDate=today;state.daily=true;state.stone+=30;state.med++;state.quests.login=true;state.claimed.login=false;log("Nhận quà tu hành hằng ngày");notify("Nhận 30 linh thạch + 1 đan");render()}
function startEnemy(newOne){if(newOne&&state.enemyHp>0){notify("Hãy kết thúc trận hiện tại hoặc rút lui");return}let m=monsters[state.monster%monsters.length];state.enemyMax=m[2]+state.wins*4;state.enemyHp=state.enemyMax;render()}
function enemyTurn(){let m=monsters[state.monster%monsters.length];let dmg=Math.max(1,m[3]+Math.floor(state.wins/3)-state.def);state.hp=Math.max(0,state.hp-dmg);log(m[1]+" phản công, gây "+dmg+" sát thương");if(state.hp<=0){state.hp=Math.ceil(state.maxhp*.55);state.enemyHp=0;log("Bạn được đưa về đạo tràng để hồi phục");notify("Thí luyện thất bại, đã hồi phục một phần");}}
function attack(){if(state.enemyHp<=0){notify("Hãy tìm đối thủ mới");return}let dmg=Math.max(2,state.atk+Math.floor(Math.random()*6));state.enemyHp=Math.max(0,state.enemyHp-dmg);log("Bạn đánh thường gây "+dmg+" sát thương");if(state.enemyHp<=0)winBattle();else enemyTurn();render()}
function skill(){if(state.realm<1){notify("Đạt Luyện Khí để mở pháp thuật");return}if(state.enemyHp<=0)return;let dmg=state.atk*2+12;state.enemyHp=Math.max(0,state.enemyHp-dmg);log("Thi triển Hỏa Cầu Thuật gây "+dmg+" sát thương");if(state.enemyHp<=0)winBattle();else enemyTurn();render()}
function useMed(){if(state.med<=0){notify("Không còn đan dược");return}if(state.hp>=state.maxhp){notify("Sinh lực đang đầy");return}state.med--;let h=Math.min(45,state.maxhp-state.hp);state.hp+=h;log("Dùng đan dược hồi "+h+" sinh lực");notify("Sinh lực +"+h);render()}
function winBattle(){let reward=18+state.wins*3;state.stone+=reward;gainXP(25+state.wins*4);state.wins++;state.quests.win=true;if(Math.random()<.35){state.essence++;log("Nhặt được 1 linh thảo")}log("Chiến thắng! Nhận "+reward+" linh thạch");state.enemyHp=0;state.monster=Math.min(monsters.length-1,Math.floor(state.wins/2));notify("Chiến thắng · +"+reward+" linh thạch")}
function retreat(){state.enemyHp=0;state.hp=Math.max(1,state.hp);log("Bạn chủ động rút lui");notify("Đã rút lui");render()}
function buyMed(){if(state.stone<25){notify("Không đủ linh thạch");return}state.stone-=25;state.med++;notify("Đã mua 1 đan dược");render()}
function upgrade(type){if(state.stone<40){notify("Cần 40 linh thạch");return}state.stone-=40;if(type==="sword"){state.sword++;state.atk+=8}else{state.armor++;state.def+=6}state.power=state.atk*2+state.def*3+state.sword*8+state.armor*6;state.quests.upgrade=true;log("Cường hóa "+(type==="sword"?"Thanh Phong Kiếm":"Huyền Thiết Giáp"));notify("Cường hóa thành công");render()}
function joinSect(){let names=["Thanh Vân Tông","Thiên Kiếm Môn","Vạn Hoa Cốc"];let next=names[(names.indexOf(state.sect)+1)%names.length];state.sect=next;notify("Đã gia nhập "+next);log("Gia nhập "+next);render()}
function donate(){if(state.stone<20){notify("Không đủ linh thạch");return}state.stone-=20;state.sectLv++;gainXP(25);log("Cống hiến tông môn, nhận 25 tu vi");notify("Tông môn tăng cấp");render()}
function selectZone(i){if(i>state.realm){notify("Cảnh giới chưa đủ để vào khu vực này");return}state.zone=i;log("Di chuyển đến "+["Rừng Thanh Khê","Hàn Phong Cốc","Vạn Kiếm Sơn","Hỏa Diệm Bí Cảnh"][i]);render()}
function explore(){let today=new Date().toLocaleDateString("en-CA");if(state.exploreDate===today)return;state.exploreDate=today;let roll=Math.random();let bonus=(state.zone+1);if(roll<.42){let n=12*bonus;state.stone+=n;log("Thám hiểm tìm thấy "+n+" linh thạch");notify("Tìm thấy "+n+" linh thạch")}else if(roll<.78){let n=1+(state.zone>1?1:0);state.essence+=n;log("Thu thập được "+n+" linh thảo");notify("Thu được "+n+" linh thảo")}else{let n=15*bonus;gainXP(n);log("Ngộ đạo giữa bí cảnh, tăng "+n+" tu vi");notify("Ngộ đạo +"+n+" tu vi")}render()}
function brew(){if(state.essence<2)return;state.essence-=2;state.med++;state.alchemyCount++;log("Luyện thành một Tiểu Hồi Nguyên Đan");notify("Luyện đan thành công");render()}

function openRoots(){
 const roots=["Kim","Mộc","Thủy","Hỏa","Thổ"];
 const current=state.root;
 $("dialog").innerHTML=`<h3>☯ Khai mở linh căn</h3><div class="small">Chọn một linh căn. Mỗi loại ban một thiên phú riêng; chỉ chọn được một lần.</div>${roots.map((r,i)=>`<div class="item"><div><b class="itemname">${["⚔️","🌿","💧","🔥","🪨"][i]} Linh căn ${r}</b><div class="itemdesc">${["Tăng công kích","Tăng tu vi nhận được","Tăng sinh lực tối đa","Tăng sát thương pháp thuật","Tăng phòng ngự"][i]}</div></div><button class="btn" onclick="chooseRoot('${r}')" ${current!=="Chưa khai mở"?"disabled":""}>${current===r?"Đã chọn": "Chọn"}</button></div>`).join("")}<button class="btn secondary wide" style="margin-top:10px" onclick="closeModal()">Đóng</button>`;
 $("modal").classList.add("show");
}
function chooseRoot(r){
 if(state.root!=="Chưa khai mở"){notify("Linh căn đã được khai mở");return}
 state.root=r;
 if(r==="Kim")state.atk+=5;
 if(r==="Mộc"){state.maxhp+=20;state.hp+=20}
 if(r==="Thủy")state.maxhp+=35,state.hp+=35;
 if(r==="Hỏa")state.atk+=3,state.skill=1;
 if(r==="Thổ")state.def+=5;
 log("Khai mở linh căn "+r);
 closeModal();notify("Linh căn "+r+" đã thức tỉnh");render();
}
function petAction(){
 if(!state.pet){
  if(state.stone<100){notify("Cần 100 linh thạch để chiêu mộ");return}
  state.stone-=100;state.pet=1;state.petLv=1;log("Chiêu mộ linh thú Tiểu Thanh Long");notify("Tiểu Thanh Long gia nhập đội ngũ");
 }else{
  const cost=40*state.petLv;
  if(state.stone<cost){notify("Cần "+cost+" linh thạch để bồi dưỡng");return}
  state.stone-=cost;state.petLv++;log("Linh thú tăng lên cấp "+state.petLv);notify("Linh thú đã trưởng thành");
 }
 render();
}
function bossChallenge(){
 if(state.bossHp>0){notify("Boss vẫn đang ở đó, hãy xuất chiêu");return}
 state.bossMax=160+state.bossWins*45;state.bossHp=state.bossMax;
 log("Bắt đầu khiêu chiến Cổ Long守 Hộ");notify("Boss bí cảnh xuất hiện");render();
}
function bossStrike(){
 if(state.bossHp<=0){notify("Hãy khiêu chiến trước");return}
 const rootBonus=state.root==="Hỏa"?8:0;
 const petBonus=state.pet?state.petLv*4:0;
 const dmg=state.atk+Math.floor(Math.random()*8)+rootBonus+petBonus;
 state.bossHp=Math.max(0,state.bossHp-dmg);
 log("Gây "+dmg+" sát thương lên Boss bí cảnh");
 if(state.bossHp<=0){
  const reward=90+state.bossWins*25;state.bossWins++;state.stone+=reward;gainXP(100+state.bossWins*20);
  if(Math.random()<.6)state.essence++;
  log("Hạ Boss! Nhận "+reward+" linh thạch");notify("Đại thắng! +"+reward+" linh thạch");
 }else{
  const hit=Math.max(2,18+state.bossWins*4-state.def-(state.root==="Thổ"?5:0));
  state.hp=Math.max(1,state.hp-hit);log("Boss phản kích gây "+hit+" sát thương");
  if(state.hp<=1){state.bossHp=0;notify("Bạn đã kiệt sức, hãy hồi phục rồi thử lại")}
 }
 render();
}
function closeModal(){$("modal").classList.remove("show")}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{page=b.dataset.page;render()}));
if(currentUser){const a=getAccounts();if(a[currentUser]&&a[currentUser].game)state={...defaults,...a[currentUser].game,quests:{...defaults.quests,...(a[currentUser].game.quests||{})},claimed:{...(a[currentUser].game.claimed||{})}};else loadGame()}else{loadGame()}
render();
if(!currentUser)setTimeout(()=>accountMenu(),250);
</script>
</body></html>
